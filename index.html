<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shivansh Playlists | Support Gateway</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="text-slate-200 min-h-screen flex flex-col justify-center items-center antialiased font-['Plus_Jakarta_Sans'] p-4">

    <div class="w-full max-w-xl text-center space-y-6">
        
        <!-- Logo Header -->
        <div class="inline-block relative">
            <img src="https://i.ibb.co/q3gD2Cm9/6226284901146149931.jpg" alt="Logo" class="w-20 h-20 rounded-2xl object-cover border-2 border-purple-500/40 mx-auto brand-neon">
        </div>

        <div class="space-y-1">
            <h1 class="text-3xl font-extrabold tracking-tight text-white">Shivansh Support System</h1>
            <p class="text-xs text-purple-400 font-medium tracking-wide">Support daily &mdash; keep free IPTV, bots & community tools running.</p>
        </div>

        <!-- Login Container Card -->
        <div class="premium-card p-6 md:p-8 rounded-3xl text-left space-y-6">
            <div class="flex items-center gap-2 text-[10px] font-bold tracking-widest text-purple-400 uppercase border-b border-purple-500/10 pb-3">
                <i class="fa-solid fa-shield-halved text-xs"></i> Login To Continue
            </div>

            <!-- Custom Mode Selection Tabs -->
            <div class="grid grid-cols-2 gap-3">
                <button id="tab-registered" onclick="switchAuthMode('registered')" class="tab-btn active py-4 rounded-xl flex flex-col items-center justify-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-key text-amber-400 text-lg"></i>
                    <span class="text-xs font-bold text-white">Registered User</span>
                </button>
                <button id="tab-guest" onclick="switchAuthMode('guest')" class="tab-btn py-4 rounded-xl flex flex-col items-center justify-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-user-secret text-purple-400 text-lg"></i>
                    <span class="text-xs font-bold text-slate-300">Guest User</span>
                </button>
            </div>

            <!-- Dynamic Interactive Form Element Inputs -->
            <div class="space-y-4">
                <div id="input-wrapper" class="space-y-2">
                    <!-- Controlled Dynamically via JavaScript Logic Below -->
                </div>
                
                <div id="error-alert" class="hidden text-xs bg-red-500/10 border border-red-500/20 text-red-400 p-3 rounded-xl font-medium"></div>

                <button onclick="handleVerificationSubmit()" class="w-full py-3.5 rounded-xl btn-purple-glow text-white font-extrabold text-xs tracking-wider uppercase cursor-pointer">
                    <i class="fa-solid fa-fingerprint mr-1.5"></i> Verify & Continue
                </button>
            </div>

            <!-- Updated Token Redirect Link -->
            <div class="text-center pt-2">
                <a href="token.html" class="text-[11px] text-purple-400/80 hover:text-purple-300 font-medium transition-colors">
                    Don't have a token? Get one here &rarr;
                </a>
            </div>
        </div>
    </div>

    <script>
        let currentMode = 'registered';

        function renderInputLayout() {
            const container = document.getElementById('input-wrapper');
            if (currentMode === 'registered') {
                container.innerHTML = `
                    <label class="text-[10px] font-bold text-slate-400 tracking-widest uppercase block">IPTV Token Access Key</label>
                    <input id="auth-payload" type="password" placeholder="Enter your IPTV token..." class="w-full input-box rounded-xl py-3.5 px-4 text-sm font-medium">
                `;
            } else {
                container.innerHTML = `
                    <label class="text-[10px] font-bold text-slate-400 tracking-widest uppercase block">Guest Handle Name (Min 2 characters)</label>
                    <input id="auth-payload" type="text" placeholder="e.g. John" class="w-full input-box rounded-xl py-3.5 px-4 text-sm font-medium">
                `;
            }
        }

        function switchAuthMode(targetMode) {
            currentMode = targetMode;
            document.getElementById('error-alert').classList.add('hidden');
            
            document.getElementById('tab-registered').classList.toggle('active', targetMode === 'registered');
            document.getElementById('tab-guest').classList.toggle('active', targetMode === 'guest');
            
            renderInputLayout();
        }

        function handleVerificationSubmit() {
    const inputVal = document.getElementById('auth-payload').value.trim();
    const alertBox = document.getElementById('error-alert');
    
    alertBox.classList.add('hidden');

    if (currentMode === 'registered') {
        // 1. Check if the input field is completely empty
        if (!inputVal) {
            alertBox.innerText = "Error: Please input a valid IPTV token string to authenticate.";
            alertBox.classList.remove('hidden');
            return;
        }
        
        // 2. STRIKT VALIDATION: Check if token starts with 'SP-' prefix
        if (!inputVal.toUpperCase().startsWith('SP-')) {
            alertBox.innerText = "Invalid Token Format: Registered tokens must begin with the 'SP-' prefix (e.g., SP-XXXX-XXXX).";
            alertBox.classList.remove('hidden');
            return;
        }
        
        localStorage.setItem('session_user_alias', 'Registered Supporter');
    } else {
        // Guest user fallback validation logic
        if (inputVal.length < 2) {
            alertBox.innerText = "Validation Failed: Guest names must contain at least 2 letters.";
            alertBox.classList.remove('hidden');
            return;
        }
        localStorage.setItem('session_user_alias', inputVal);
    }

    // SUCCESSFUL LOGIN: Route directly to their personal achievement hub
    window.location.href = "verify.html";
}
    </script>
</body>
</html>
